<main class="page">
<h1>Fast geschafft.</h1>
<p class="lead" style="color:#333">Der Fink hat dir soeben einen sechsstelligen Code per WhatsApp geschickt. Gib ihn hier ein. So wissen wir, dass die Nummer wirklich dir gehört.</p>
<form id="verify" novalidate>
  <div class="code"><input name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" aria-label="Bestätigungscode"><button class="btn btn-primary" type="submit">Bestätigen</button></div>
  <p class="form-msg" role="status" aria-live="polite"></p>
</form>
<p>Kein Code angekommen? Prüfe, ob die Nummer stimmt, oder schreib uns an <a href="mailto:support@gwunderfink.ch">support@gwunderfink.ch</a>.</p>
</main>
<script src="app.js"></script></body></html>
